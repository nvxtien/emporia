server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

spring:
  application.name: execution-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/emporia}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: ${DB_POOL_NAME:execution-pool}
      schema: ${DB_SCHEMA:emporia_execution}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  flyway:
    default-schema: ${DB_SCHEMA:emporia_execution}
    schemas: ${DB_SCHEMA:emporia_execution}
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    # Off by default. Without both flags no traceparent header is written or
    # read, so trace context does not propagate across Kafka and one order
    # fragments into several disconnected traces.
    template.observation-enabled: true
    producer:
      acks: ${KAFKA_PRODUCER_ACKS:all}
      batch-size: ${KAFKA_PRODUCER_BATCH_SIZE:16384}
      compression-type: ${KAFKA_PRODUCER_COMPRESSION:lz4}
      buffer-memory: ${KAFKA_PRODUCER_BUFFER_MEMORY:67108864}
      retries: ${KAFKA_PRODUCER_RETRIES:3}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.emporia.events.sbe.SbeKafkaSerializer
      properties:
        linger.ms: ${KAFKA_PRODUCER_LINGER_MS:5}
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:2000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:10000}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: com.emporia.events.sbe.SbeKafkaDeserializer
      properties.spring.json.trusted.packages: com.emporia.events
    listener:
      ack-mode: record
      observation-enabled: true

emporia:
  kafka:
    commands-topic: ${KAFKA_ORDER_COMMANDS_TOPIC:emporia.order.commands.v1}
    orders-topic: ${KAFKA_ORDERS_TOPIC:emporia.orders.v1}
    executions-topic: ${KAFKA_EXECUTION_COMMANDS_TOPIC:emporia.execution.commands.v1}
  services:
    static-data-url: ${EMPORIA_STATIC_DATA_URL:http://localhost:8081}
    market-data-url: ${EMPORIA_MARKET_DATA_URL:http://localhost:8084}
    order-management-url: ${EMPORIA_ORDER_MANAGEMENT_URL:http://localhost:8086}
  auth:
    token-url: ${EMPORIA_AUTH_TOKEN_URL:http://localhost:9000/oauth2/token}
    client-id: ${EXECUTION_OAUTH_CLIENT_ID:emporia-execution}
    client-secret: ${EXECUTION_OAUTH_CLIENT_SECRET:emporia-execution-local-secret}
  execution:
    venue-mode: ${EXECUTION_VENUE_MODE:simulated}
    fix-venues: ${FIX_EXECUTION_VENUES:}
    fix-tls-enabled: ${FIX_TLS_ENABLED:false}
    fix-tls-truststore-path: ${FIX_TLS_TRUSTSTORE_PATH:}
    fix-tls-truststore-password: ${FIX_TLS_TRUSTSTORE_PASSWORD:}
    fix-tls-keystore-path: ${FIX_TLS_KEYSTORE_PATH:}
    fix-tls-keystore-password: ${FIX_TLS_KEYSTORE_PASSWORD:}
    fill-delay: ${EXECUTION_FILL_DELAY:100ms}
    strategy-time-compression: ${STRATEGY_TIME_COMPRESSION:60}
    vwap-default-buckets: ${VWAP_DEFAULT_BUCKETS:10}
    sor:
      # A routed child sweeps within this budget and cancels its remainder
      # rather than resting on the book.
      slippage-bps: ${EMPORIA_SOR_SLIPPAGE_BPS:10}
      # Consecutive failed sweeps before the strategy gives up and resolves the
      # parent order, instead of retrying at tick rate forever.
      max-retries: ${EMPORIA_SOR_MAX_RETRIES:3}
    exchange-core:
      exchange-id: ${EXCHANGE_CORE_EXCHANGE_ID:emporia-simulation}
      # Deliberately outside target/. This is live venue state - the order book
      # and DMA lifecycle the engine recovers from - and target/ belongs to the
      # build. With the default under target/, any `mvn clean` while the service
      # was running deleted the directory beneath it, after which every
      # checkpoint failed silently: orders still returned 201 because they had
      # genuinely reached the venue, so only the log showed anything wrong. A
      # push does it too, since the pre-push hook runs `mvn clean verify`.
      # No "..": Spring's Path converter normalises a traversing path to null
      # and refuses to bind it.
      storage-directory: ${EXCHANGE_CORE_STORAGE_DIRECTORY:.local-run/exchange-core-simulation}
      symbol-partitions: ${EXCHANGE_CORE_SYMBOL_PARTITIONS:2}
      # Set to full-equity-risk to enable balance tracking and portfolio snapshots.
      # Requires EXCHANGE_CORE_PORTFOLIO_URL to point at the running portfolio-service.
      accounting-mode: ${EXCHANGE_CORE_ACCOUNTING_MODE:matching-only}
      portfolio-url: ${EXCHANGE_CORE_PORTFOLIO_URL:}
      portfolio-request-timeout: ${EXCHANGE_CORE_PORTFOLIO_REQUEST_TIMEOUT:3s}
      # Journalled checkpointing. Off snapshots engine state after every command;
      # on writes a journal and snapshots on the interval below instead, which
      # takes the snapshot off the command path.
      #
      # Recovery then depends on two mechanisms, not one: the journal restores
      # the matching engine, and the lifecycle projection is rebuilt from
      # order-management at startup. Verify with
      # scripts/perf/crash-recovery-check.sh before turning this on anywhere
      # that matters.
      journaling: ${EXCHANGE_CORE_JOURNALING:false}
      snapshot-interval: ${EXCHANGE_CORE_SNAPSHOT_INTERVAL:60s}

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  tracing.sampling.probability: ${OTEL_TRACE_SAMPLE_RATE:1.0}
  # NOT management.otlp.tracing.endpoint: that name is deprecated at level=error
  # in Boot 4, meaning it is no longer bound and is silently ignored.
  opentelemetry.tracing.export.otlp.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  # Traces go over OTLP; metrics stay on Prometheus per Phase 1_1. The
  # starter enables OTLP metrics export by default, which also drags in a
  # protobuf 4.x runtime that conflicts with the gRPC protobuf pin.
  otlp.metrics.export.enabled: false
  metrics.distribution:
    percentiles-histogram:
      emporia: true
      http: true
      spring.kafka: true
      jdbc: true
    minimum-expected-value.emporia: 1ms
    maximum-expected-value.emporia: 10s
