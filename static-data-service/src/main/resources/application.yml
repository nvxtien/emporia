server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: static-data-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/emporia}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin123}
    hikari:
      pool-name: ${DB_POOL_NAME:static-data-pool}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_TIME_MS:120000}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_THRESHOLD_MS:0}
  flyway:
    default-schema: ${DB_SCHEMA:emporia_static_data}
    schemas: ${DB_SCHEMA:emporia_static_data}
    create-schemas: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: ${DB_SCHEMA:emporia_static_data}
  security.oauth2.resourceserver.jwt:
    issuer-uri: ${EMPORIA_AUTH_ISSUER:http://localhost:3001}
    jwk-set-uri: ${EMPORIA_AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

management.endpoints.web.exposure.include: health,info

emporia.static-data:
  legacy-import-enabled: ${LEGACY_REFERENCE_DATA_IMPORT_ENABLED:true}
  legacy-reference-schema: ${LEGACY_REFERENCE_DATA_SCHEMA:referencedata}
  alpaca-import-enabled: ${ALPACA_REFERENCE_DATA_IMPORT_ENABLED:false}
  alpaca-api-endpoint: ${APCA_API_ENDPOINT:https://paper-api.alpaca.markets/v2}
  alpaca-api-key-id: ${APCA_API_KEY_ID:}
  alpaca-api-secret-key: ${APCA_API_SECRET_KEY:}
  alpaca-default-reference-price: ${ALPACA_DEFAULT_REFERENCE_PRICE:100}
