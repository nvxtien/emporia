# ==============================================================================
# Linux Tuned System Profile for Low-Latency HFT Trading Engine
# Installation: Place in /etc/tuned/trading-profile/tuned.conf and activate via:
#   sudo tuned-adm profile trading-profile
# ==============================================================================

[main]
summary=High-Frequency Trading Ultra Low Latency System Profile

[cpu]
governor=performance
energy_perf_bias=performance
min_perf_pct=100

[vm]
transparent_hugepages=never

[sysctl]
kernel.sched_rt_runtime_us=-1
net.core.busy_read=50
net.core.busy_poll=50
net.core.rmem_max=16777216
net.core.wmem_max=16777216
