server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
spring:
  application.name: order-command-service
  security.oauth2.resourceserver.jwt:
    issuer-uri: ${EMPORIA_AUTH_ISSUER:http://localhost:3001}
    jwk-set-uri: ${EMPORIA_AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    # Off by default. Without both flags no traceparent header is written or
    # read, so trace context does not propagate across Kafka and one order
    # fragments into several disconnected traces.
    template.observation-enabled: true
    listener.observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties.spring.json.trusted.packages: com.emporia.events
emporia:
  static-data.url: ${EMPORIA_STATIC_DATA_URL:http://localhost:8081}
  kafka:
    commands-topic: ${KAFKA_ORDER_COMMANDS_TOPIC:emporia.order.commands.v1}
    results-topic: ${KAFKA_ORDER_RESULTS_TOPIC:emporia.order.results.v1}
    command-timeout: ${KAFKA_COMMAND_TIMEOUT:8s}
management:
  endpoints.web.exposure.include: health,info,prometheus
  tracing.sampling.probability: ${OTEL_TRACE_SAMPLE_RATE:1.0}
  # NOT management.otlp.tracing.endpoint: that name is deprecated at level=error
  # in Boot 4, meaning it is no longer bound and is silently ignored.
  opentelemetry.tracing.export.otlp.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  # Traces go over OTLP; metrics stay on Prometheus per Phase 1_1. The
  # starter enables OTLP metrics export by default, which also drags in a
  # protobuf 4.x runtime that conflicts with the gRPC protobuf pin.
  otlp.metrics.export.enabled: false
  metrics.distribution:
    percentiles-histogram:
      emporia: true
      http: true
      spring.kafka: true
    minimum-expected-value.emporia: 1ms
    maximum-expected-value.emporia: 10s
