apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data-service
  labels:
    app: market-data-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: market-data-service
  template:
    metadata:
      labels:
        app: market-data-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: /actuator/prometheus
    spec:
      containers:
        - name: market-data-service
          image: emporia-market-data-service:latest
          ports:
            - name: http
              containerPort: 8084
            - name: grpc
              containerPort: 50551
          env:
            - name: MARKET_DATA_PROVIDER
              value: simulated
            - name: EMPORIA_STATIC_DATA_URL
              value: http://static-data-service:8081
            - name: EMPORIA_AUTH_TOKEN_URL
              value: http://authorisation-service:9000/oauth2/token
            - name: EMPORIA_AUTH_JWK_SET_URI
              value: http://authorisation-service:9000/oauth2/jwks
            - name: MARKET_DATA_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: emporia-market-data
                  key: oauth-client-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: market-data-service
spec:
  selector:
    app: market-data-service
  sessionAffinity: ClientIP
  ports:
    - name: http
      port: 8084
      targetPort: http
    - name: grpc
      port: 50551
      targetPort: grpc
