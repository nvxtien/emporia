# Prometheus — scrapes the Emporia services' /actuator/prometheus endpoints
# and the Kafka exporter. Phase 1_1 keeps the actuator endpoints during the
# transition rather than moving metrics onto OTLP.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  # Broker-side consumer group lag. This is the source of truth for lag
  # dashboards: it keeps reporting when a consumer process is down, and it
  # carries the consumergroup label that Kafka client metrics do not expose.
  - job_name: kafka-exporter
    static_configs:
      - targets: ['kafka-exporter:9308']

  # order-outbox Debezium connector's own RUNNING/FAILED state - see
  # deploy/otel/kafka-connect-status-exporter.py. Docker-only service, so one
  # target regardless of host-JVM vs full-Docker service deployment mode.
  - job_name: kafka-connect-exporter
    static_configs:
      - targets: ['kafka-connect-exporter:9405']

  # Each target carries an explicit `service` label. Kafka client metrics
  # identify a consumer only by client_id, so without this there is no way to
  # group application-side panels by service.
  #
  # Full-stack Docker mode: services run as containers on the compose network.
  - job_name: emporia
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['order-management-service:8086']
        labels: { service: order-management-service, deployment: docker }
      - targets: ['execution-service:8087']
        labels: { service: execution-service, deployment: docker }
      - targets: ['portfolio-service:8088']
        labels: { service: portfolio-service, deployment: docker }
      - targets: ['market-data-service:8084']
        labels: { service: market-data-service, deployment: docker }
      - targets: ['gateway:8082']
        labels: { service: gateway, deployment: docker }

  # Host-JVM modes (run-local.sh / run-infra-docker.sh): the services run
  # outside the container, so they are reached through host.docker.internal.
  - job_name: emporia-host
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8086']
        labels: { service: order-management-service, deployment: host }
      - targets: ['host.docker.internal:8087']
        labels: { service: execution-service, deployment: host }
      - targets: ['host.docker.internal:8088']
        labels: { service: portfolio-service, deployment: host }
      - targets: ['host.docker.internal:8084']
        labels: { service: market-data-service, deployment: host }
      - targets: ['host.docker.internal:8080']
        labels: { service: gateway, deployment: host }
