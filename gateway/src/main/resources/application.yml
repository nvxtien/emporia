server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: emporia-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: authentication
              uri: ${emporia.auth.url}
              predicates:
                - Path=/.well-known/**,/oauth2/**,/userinfo,/connect/logout,/login,/logout,/auth/csrf,/default-ui.css,/favicon.ico
              filters:
                - PreserveHostHeader
            - id: authentication-admin-service
              uri: ${emporia.auth.url}
              predicates:
                - Path=/api/admin/users/**
              filters:
                - StripPrefix=1
            - id: authentication-admin-audit-service
              uri: ${emporia.auth.url}
              predicates:
                - Path=/api/admin/audit/**
                - Method=GET
              filters:
                - StripPrefix=1
            - id: static-data-service
              uri: ${emporia.services.static-data-url}
              predicates:
                - Path=/api/instruments/**
              filters:
                - StripPrefix=1
            - id: static-data-admin-service
              uri: ${emporia.services.static-data-url}
              predicates:
                - Path=/api/admin/static-data/**
                - Method=GET,POST,PUT
              filters:
                - StripPrefix=1
            - id: user-preferences-service
              uri: ${emporia.services.user-preferences-url}
              predicates:
                - Path=/api/watchlist/**,/api/workspace-preferences/**
              filters:
                - StripPrefix=1
            - id: market-data-service
              uri: ${emporia.services.market-data-url}
              predicates:
                - Path=/api/market-data/**
              filters:
                - StripPrefix=1
            - id: order-management-service
              uri: ${emporia.services.order-management-url}
              predicates:
                - Path=/api/orders/**
                - Method=GET
              filters:
                - StripPrefix=1
            - id: order-management-command-service
              uri: ${emporia.services.order-management-url}
              predicates:
                - Path=/api/orders/**
                - Method=POST,PUT
              filters:
                - StripPrefix=1
                - name: OrderRateLimiter
                  args:
                    replenishRate: ${emporia.gateway.order-rate-limiter.replenish-rate:20}
                    burstCapacity: ${emporia.gateway.order-rate-limiter.burst-capacity:40}
                    requestedTokens: ${emporia.gateway.order-rate-limiter.requested-tokens:1}
                - name: CircuitBreaker
                  args:
                    name: orderCommands
                    fallbackUri: forward:/fallback/orders
                    statusCodes:
                      - 500
                      - 502
                      - 503
                      - 504
            - id: portfolio-service
              uri: ${emporia.services.portfolio-url}
              predicates:
                - Path=/api/portfolio/**
                - Method=GET,POST
              filters:
                - StripPrefix=1
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/.well-known/**]': &spa-cors
                allowed-origin-patterns:
                  - ${EMPORIA_CORS_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
                  - ${EMPORIA_CORS_ALLOWED_LOOPBACK_ORIGIN_PATTERN:http://127.0.0.1:*}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: '*'
                exposed-headers:
                  - X-Request-Id
                allow-credentials: true
                max-age: 3600
              '[/oauth2/authorize]': *spa-cors
              '[/oauth2/token]': *spa-cors
              '[/oauth2/revoke]': *spa-cors
              '[/userinfo]': *spa-cors
              '[/connect/logout]': *spa-cors
              '[/auth/csrf]': *spa-cors
              '[/api/**]': *spa-cors
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${EMPORIA_AUTH_ISSUER:http://localhost:3000}
          jwk-set-uri: ${EMPORIA_AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

emporia:
  auth:
    url: ${EMPORIA_AUTH_URL:http://localhost:9000}
  gateway:
    order-rate-limiter:
      replenish-rate: ${EMPORIA_GATEWAY_ORDER_RL_REPLENISH_RATE:20}
      burst-capacity: ${EMPORIA_GATEWAY_ORDER_RL_BURST_CAPACITY:40}
      requested-tokens: ${EMPORIA_GATEWAY_ORDER_RL_REQUESTED_TOKENS:1}
      bypass-service-account-claim: ${EMPORIA_GATEWAY_ORDER_RL_BYPASS_SERVICE_ACCOUNT_CLAIM:service_account=true}
      bypass-authorities: ${EMPORIA_GATEWAY_ORDER_RL_BYPASS_AUTHORITIES:}
      bypass-claims: ${EMPORIA_GATEWAY_ORDER_RL_BYPASS_CLAIMS:}
      bypass-remote-addresses: ${EMPORIA_GATEWAY_ORDER_RL_BYPASS_REMOTE_ADDRESSES:}
  services:
    static-data-url: ${EMPORIA_STATIC_DATA_URL:http://localhost:8081}
    user-preferences-url: ${EMPORIA_USER_PREFERENCES_URL:http://localhost:8083}
    market-data-url: ${EMPORIA_MARKET_DATA_URL:http://localhost:8084}
    order-management-url: ${EMPORIA_ORDER_MANAGEMENT_URL:http://localhost:8086}
    portfolio-url: ${EMPORIA_PORTFOLIO_URL:http://localhost:8088}

resilience4j:
  circuitbreaker:
    instances:
      orderCommands:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: ${EMPORIA_GATEWAY_ORDER_CB_WINDOW_SIZE:100}
        minimumNumberOfCalls: ${EMPORIA_GATEWAY_ORDER_CB_MIN_CALLS:25}
        failureRateThreshold: ${EMPORIA_GATEWAY_ORDER_CB_FAILURE_RATE:75}
        waitDurationInOpenState: ${EMPORIA_GATEWAY_ORDER_CB_OPEN_DURATION:5s}
        permittedNumberOfCallsInHalfOpenState: ${EMPORIA_GATEWAY_ORDER_CB_HALF_OPEN_CALLS:5}
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      orderCommands:
        timeoutDuration: ${EMPORIA_GATEWAY_ORDER_CB_TIMEOUT:12s}
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  application:
    name: ${spring.application.name}
    description: Reactive API gateway for Emporia services

logging:
  pattern:
    correlation: '[%X{traceId:-},%X{spanId:-}] '
