x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: admin123

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  interval: 5s
  timeout: 5s
  retries: 10

services:
  authentication-postgres:
    image: postgres:16-alpine
    container_name: emporia-authentication-postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: emporia_authentication
    ports:
      - "5433:5432"
    volumes:
      - emporia-authentication-postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck

  static-data-postgres:
    image: postgres:16-alpine
    container_name: emporia-static-data-postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: emporia_static_data
    ports:
      - "5434:5432"
    volumes:
      - emporia-static-data-postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck

  user-preferences-postgres:
    image: postgres:16-alpine
    container_name: emporia-user-preferences-postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: emporia_user_preferences
    ports:
      - "5435:5432"
    volumes:
      - emporia-user-preferences-postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck

  order-management-postgres:
    image: postgres:16-alpine
    container_name: emporia-order-management-postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: emporia_order_management
    ports:
      - "5436:5432"
    volumes:
      - emporia-order-management-postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck

  execution-postgres:
    image: postgres:16-alpine
    container_name: emporia-execution-postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: emporia_execution
    ports:
      - "5437:5432"
    volumes:
      - emporia-execution-postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck

  portfolio-postgres:
    image: postgres:16-alpine
    container_name: emporia-portfolio-postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: emporia_portfolio
    ports:
      - "5438:5432"
    volumes:
      - emporia-portfolio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck

  # --- Observability (REWORK_NOTE Phase 1_1) -------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: emporia-otel-collector
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.6.1
    container_name: emporia-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0:0"
    volumes:
      - ./deploy/otel/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - emporia-tempo-data:/var/tempo
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: emporia-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      # Exemplar storage is off by default, and without it Prometheus silently
      # discards the trace_id attached to each histogram bucket. The services
      # emit them correctly, so the only visible symptom is that jumping from a
      # latency spike to an example trace never works — which is the whole
      # reason Phase 1_1 chose Tempo + Grafana over a standalone Jaeger.
      - --enable-feature=exemplar-storage
    volumes:
      - ./deploy/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/otel/alerts:/etc/prometheus/alerts:ro
      - emporia-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      # Lets the emporia-host scrape job reach services on the host JVM
      # (run-local.sh / run-infra-docker.sh modes) on Linux as well as macOS.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: emporia-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/otel/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/emporia.yaml:ro
      - ./deploy/otel/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/emporia.yaml:ro
      - ./deploy/otel/dashboards:/etc/grafana/provisioning/dashboards/emporia:ro
      - emporia-grafana-data:/var/lib/grafana
    ports:
      # 3000 and 3001 are taken by the frontend in Docker and local modes.
      - "3300:3000"
    depends_on:
      - tempo
      - prometheus

volumes:
  emporia-authentication-postgres-data:
  emporia-static-data-postgres-data:
  emporia-user-preferences-postgres-data:
  emporia-order-management-postgres-data:
  emporia-execution-postgres-data:
  emporia-portfolio-postgres-data:
  emporia-tempo-data:
  emporia-prometheus-data:
  emporia-grafana-data:
